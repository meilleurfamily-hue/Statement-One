<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StatementOne Demo</title><style>:root{--n:#06172b;--b:#0e3157;--gold:#d7aa45;--gold2:#f1d483;--blue:#1688e8;--p:#f5f7fa;--i:#10233d;--m:#65768a;--l:#d9e0e7;--g:#168c4b}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f8fb;color:var(--i)}header{background:linear-gradient(120deg,#041426,#0b2947);color:white;padding:18px;border-bottom:3px solid var(--gold)}.brand{font-family:Georgia,serif;font-size:30px;font-weight:900;letter-spacing:-.5px}.brandmark{display:inline-block;width:38px;height:42px;margin-right:10px;vertical-align:middle;position:relative;background:linear-gradient(145deg,#1b96f3,#0868c4);clip-path:polygon(50% 0,95% 18%,88% 72%,50% 100%,12% 72%,5% 18%)}.brandmark:after{content:"";position:absolute;inset:9px 10px;background:#06172b;clip-path:polygon(0 0,100% 0,100% 32%,38% 32%,38% 46%,100% 46%,100% 100%,0 100%,0 68%,62% 68%,62% 54%,0 54%)}.brandone{color:var(--blue)}.portal{float:right;border:1px solid var(--gold);border-radius:8px;padding:8px 12px;font-weight:800;font-size:13px}.demo{background:#f7e8b9;color:#392b0c;padding:9px;text-align:center;font-weight:800;font-size:12px}.wrap{max-width:850px;margin:auto;padding:16px}.card{background:white;border:1px solid var(--l);border-radius:16px;padding:18px;margin:14px 0}.btn{display:inline-block;border:0;border-radius:8px;background:var(--n);color:white;padding:12px 16px;font-weight:800;text-decoration:none;cursor:pointer}.alt{background:white;color:var(--i);border:1px solid var(--l)}input,textarea,select{width:100%;padding:12px;border:1px solid #b8c8d6;border-radius:10px;font:inherit}.field{margin:13px 0}.field label{font-weight:800;display:block;margin-bottom:6px}.muted{color:var(--m)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:white;border:1px solid var(--l);border-top:3px solid var(--gold);border-radius:10px;padding:13px}.stat b{font-size:25px;display:block}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.session{display:grid;grid-template-columns:70px 1fr 1fr 1fr;gap:8px;padding:11px 0;border-bottom:1px solid var(--l)}.ok{color:var(--g);font-weight:800}.lang{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lang button{padding:12px;background:white;border:1px solid var(--l);border-radius:9px}.lang button.on{border:2px solid var(--b);background:var(--p)}.notice{background:#f8fafc;border-left:3px solid var(--gold);padding:11px;border-radius:6px}.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.recordbox{border:1px solid var(--l);border-radius:14px;padding:16px;background:#fbfdff}.timer{font-size:28px;font-weight:900;margin:10px 0}.rec{background:#b42318}.audio{width:100%;margin:12px 0}.qr{display:block;width:230px;height:230px;margin:15px auto}.steps{font-weight:800;color:var(--b)}.sigbox{border:2px solid #b8c8d6;border-radius:12px;background:white;overflow:hidden}.sigbox canvas{display:block;width:100%;height:180px;touch-action:none}.sigactions{display:flex;justify-content:flex-end;margin-top:8px}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}.session{grid-template-columns:55px 1fr 1fr}.session span:last-child{grid-column:2/4}} .shell{display:grid;grid-template-columns:210px 1fr;min-height:100vh}.side{background:#041426;color:#dce7f2;padding:22px 14px;border-right:1px solid #17334f}.slogo{font-family:Georgia,serif;font-size:22px;color:white;font-weight:900;margin-bottom:28px}.slogo b{color:var(--blue)}.smark{display:inline-block;width:25px;height:28px;margin-right:7px;vertical-align:middle;background:linear-gradient(145deg,#1b96f3,#0868c4);clip-path:polygon(50% 0,95% 18%,88% 72%,50% 100%,12% 72%,5% 18%)}.snav{display:block;padding:12px;border-radius:7px;margin:5px 0;color:#dce7f2;text-decoration:none;cursor:pointer}.snav:hover,.snav.active{background:linear-gradient(90deg,#0c65b6,#1688e8);color:white;font-weight:900}.maincol{min-width:0}.mobilemenu{display:none}@media(max-width:760px){.shell{display:block}.side{display:none}.mobilemenu{display:inline-block}.portal{display:none}}@media print{.side,header,.demo{display:none!important}.shell{display:block}.wrap{max-width:none;padding:0}} </style></head><body><div class="shell"><aside class="side"><div class="slogo"><span class="smark"></span>Statement<b>One</b>™</div><a class="snav active" onclick="officer()">▣ Dashboard</a><a class="snav" onclick="showOccurrences()">▰ Occurrences</a><a class="snav" onclick="showOccurrences()">▤ Evidence Packages</a><a class="snav" onclick="showOccurrences()">● Witnesses</a><a class="snav" onclick="showOccurrences()">▧ Reports</a><a class="snav">⚙ Settings</a><div style="margin-top:35px;border:1px solid #8e6d2d;padding:10px;font-size:10px;color:#e6c76f">DEMONSTRATION<br>NOT FOR REAL EVIDENCE</div></aside><main class="maincol"><header><div class="portal">Officer Portal</div><div class="brand"><span class="brandmark"></span>Statement<span class="brandone">One</span>™</div><div style="font-size:11px;letter-spacing:1.4px;margin-left:51px">REAL STATEMENTS. REAL EVIDENCE. REAL IMPACT.</div></header><div class="demo">DEMONSTRATION PROTOTYPE — FICTIONAL INFORMATION ONLY — NOT FOR REAL EVIDENCE</div><div class="wrap" id="root"></div></main></div><script>
const API='https://kpogmxdafsokmmvxbrnh.supabase.co/functions/v1/statementone-demo';const root=document.getElementById('root');const qs=new URLSearchParams(location.search);const scene=qs.get('scene');
function officer(){root.innerHTML=`<div class="card"><div style="border-bottom:1px solid var(--l);padding-bottom:12px;margin-bottom:16px"><span class="muted">OFFICER PORTAL / DASHBOARD</span><h1 style="margin-bottom:4px">Dashboard</h1><span class="muted">Create and manage secure witness intake.</span></div><p class="muted">Create a fictional occurrence, then scan the QR from a second device.</p><div class="field"><label>Incident type</label><select id="type"><option>Motor Vehicle Collision</option><option>Property Incident</option><option>Public Safety Incident</option></select></div><button class="btn" id="create">Create Demo Occurrence</button> <button class="btn alt" id="history">Occurrences</button></div><div id="scene"></div>`;document.getElementById('create').onclick=createScene;document.getElementById('history').onclick=showOccurrences}
async function showOccurrences(q=''){root.innerHTML='<div class="card"><div class="row"><div><span class="muted">OFFICER PORTAL / OCCURRENCES</span><h1>Occurrences</h1></div><button class="btn alt" id="newocc">+ New Occurrence</button></div><div class="field"><label>Search occurrence number or incident type</label><div class="row"><input id="oq" style="flex:1" value="'+esc(q)+'" placeholder="SO-2026-... or Motor Vehicle Collision"><button class="btn" id="osearch">Search</button></div></div></div><div id="olist" class="card">Loading occurrences…</div>';newocc.onclick=officer;osearch.onclick=()=>showOccurrences(oq.value);let r=await fetch(API+'?action=occurrences&q='+encodeURIComponent(q)),d=await r.json(),os=d.occurrences||[];olist.innerHTML=os.length?'<h3 style="border-bottom:2px solid var(--gold);padding-bottom:10px">Saved occurrences</h3>'+os.map(o=>'<div class="notice" style="margin:10px 0"><div class="row"><div><b>'+esc(o.occurrence_no)+'</b><br>'+esc(o.incident_type)+'<br><span class="muted">'+new Date(o.created_at).toLocaleString()+'</span></div><div><b>'+o.sessions+'</b> witness session(s)<br><span class="ok">'+o.submitted+' submitted</span><br>'+o.evidence_files+' evidence file(s)<br><button class="btn alt" style="margin-top:8px" onclick="reopenOccurrence(\''+esc(o.scene_code)+'\')">Open Occurrence</button></div></div></div>').join(''):'<span class="muted">No saved occurrences found.</span>'}async function reopenOccurrence(code){window.scene=code;let r=await fetch(API+'?action=dashboard&scene_code='+encodeURIComponent(code)),d=await r.json();if(!r.ok){alert(d.error||'Occurrence unavailable');return}let join=location.origin+location.pathname+'?scene='+encodeURIComponent(code);root.innerHTML='<div class="card"><div class="row"><div><span class="muted">SAVED OCCURRENCE</span><h2>'+esc(d.occurrence.occurrence_no)+'</h2></div><button class="btn alt" onclick="showOccurrences()">← Occurrences</button></div><a class="btn alt" href="'+join+'" target="_blank">Open Witness Link</a></div><div class="grid"><div class="stat"><b id="total">0</b>Sessions</div><div class="stat"><b id="sub">0</b>Submitted</div><div class="stat"><b id="prog">0</b>In progress</div><div class="stat"><b id="ev">0</b>Evidence files</div></div><div class="card"><h3>Witnesses & evidence packages</h3><div id="sessions"></div></div>';refresh();window._refreshTimer&&clearInterval(window._refreshTimer);window._refreshTimer=setInterval(refresh,2500)}
async function createScene(){let r=await fetch(API+'?action=create-occurrence',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({incident_type:document.getElementById('type').value})});let o=await r.json();let join=location.origin+location.pathname+'?scene='+encodeURIComponent(o.scene_code);document.getElementById('scene').innerHTML=`<div class="card"><div class="row"><div><span class="muted">FICTIONAL OCCURRENCE</span><h2>${o.occurrence_no}</h2></div><a class="btn alt" href="${join}" target="_blank">Open Witness Link</a></div><img class="qr" alt="Scene QR" src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(join)}"><p style="text-align:center"><b>Scan with a second phone</b></p></div><div class="grid"><div class="stat"><b id="total">0</b>Sessions</div><div class="stat"><b id="sub">0</b>Submitted</div><div class="stat"><b id="prog">0</b>In progress</div><div class="stat"><b id="ev">0</b>Evidence files</div></div><div class="card"><h3 style="border-bottom:2px solid var(--gold);padding-bottom:10px">Live witness intake</h3><div id="sessions"><span class="muted">Waiting for a witness…</span></div></div>`;window.scene=o.scene_code;refresh();setInterval(refresh,2500)}
async function refresh(){if(!window.scene)return;let r=await fetch(API+'?action=dashboard&scene_code='+encodeURIComponent(window.scene));let d=await r.json(),s=d.sessions||[];total.textContent=s.length;sub.textContent=s.filter(x=>x.status==='submitted').length;prog.textContent=s.filter(x=>x.status==='in_progress').length;ev.textContent=s.reduce((a,x)=>a+(x.evidence_count||0),0);sessions.innerHTML=s.length?s.map(x=>`<div class="session"><b>Witness ${String(x.session_no).padStart(3,'0')}</b><span class="${x.status==='submitted'?'ok':''}">${x.status.replace('_',' ')}</span><span>${x.language}</span><span>${x.evidence_count} file(s)${x.status==='submitted'?'<br><button class="btn alt" style="margin-top:7px;padding:8px 10px" onclick="viewPackage('+x.session_no+')">View Package</button>':''}</span></div>`).join(''):'<span class="muted">Waiting for a witness…</span>'}
async function viewPackage(no){let r=await fetch(API+'?action=officer-package&scene_code='+encodeURIComponent(window.scene)+'&session_no='+no),d=await r.json();if(!r.ok){alert(d.error||'Package unavailable');return}const e=(d.evidence||[]).map(x=>'<tr><td>E'+String(x.evidence_no||0).padStart(3,'0')+'</td><td>'+esc(x.original_name)+'</td><td>'+Math.round((x.size_bytes||0)/1024)+' KB</td><td style="word-break:break-all">'+esc(x.sha256||'')+'</td></tr>').join('');const w=window.open('','_blank');w.document.write('<!doctype html><html><head><title>'+esc(d.package_id)+'</title><style>:root{--navy:#06172b;--gold:#d7aa45} .reportbrand{border-bottom:4px solid var(--gold);padding:16px 0;margin-bottom:18px}.reportbrand h1{font-family:Georgia,serif;margin:0;color:var(--navy)}.reportbrand h1 span{color:#b88a2d}.reportbrand small{letter-spacing:1px}.badge{float:right;background:var(--navy);color:white;padding:10px 14px;border-top:3px solid var(--gold);font-weight:bold} body{font-family:Arial;max-width:900px;margin:30px auto;padding:20px;color:#10233d}h1{color:#071d3a}.bar{background:#fff0b8;padding:10px;font-weight:bold}.box{border:1px solid #ccd9e5;border-radius:10px;padding:14px;margin:14px 0}table{width:100%;border-collapse:collapse}td,th{border:1px solid #ccd9e5;padding:8px;text-align:left}.actions{position:sticky;top:0;background:white;padding:10px 0}button{padding:10px 14px;margin-right:8px;font-weight:bold}@media print{.actions{display:none}body{margin:0}.bar{border:1px solid #999}}</style></head><body><div class="actions"><button onclick="print()">Print / Save PDF</button><button onclick="downloadPkg()">Download Package Report</button></div><div class="reportbrand"><div class="badge">EVIDENCE PACKAGE<br><small>DEMONSTRATION</small></div><h1>Statement<span>One</span>™</h1><small>REAL STATEMENTS. REAL EVIDENCE. REAL IMPACT.</small></div><div class="bar">DEMONSTRATION — NOT FOR REAL EVIDENCE</div><h1>Evidence Package Report</h1><div class="box"><b>Occurrence:</b> '+esc(d.occurrence.occurrence_no)+'<br><b>Incident:</b> '+esc(d.occurrence.incident_type||'')+'<br><b>Package ID:</b> '+esc(d.package_id)+'<br><b>Witness:</b> '+String(d.witness.session_no).padStart(3,'0')+'<br><b>Submitted:</b> '+esc(d.witness.submitted_at||'')+'<br><b>Signature:</b> '+(d.witness.signature_confirmed?'Confirmed':'Not recorded')+'</div><div class="box"><h2>Witness-reviewed statement</h2><p style="white-space:pre-wrap">'+esc(d.witness.reviewed_transcript||'')+'</p></div><div class="box"><h2>Original machine transcript</h2><p style="white-space:pre-wrap">'+esc(d.witness.original_transcript||'')+'</p></div><h2>Evidence inventory</h2><table><tr><th>ID</th><th>Original file</th><th>Size</th><th>SHA-256</th></tr>'+e+'</table><div class="box"><b>Package SHA-256:</b><div style="word-break:break-all">'+esc(d.package_hash||'Pending')+'</div></div><script>const pkg='+JSON.stringify(JSON.stringify(d))+';function downloadPkg(){const b=new Blob([pkg],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="'+esc(d.package_id)+'.json";a.click();URL.revokeObjectURL(a.href)}<\/script></body></html>');w.document.close()}
let sess,lang='English',n=1,files=0,evidenceItems=[],name='',contact='',tr='',rev='',signatureData='',mediaRecorder=null,audioChunks=[],audioBlob=null,audioURL='',recSeconds=0,recTimer=null,recState='idle';
async function join(){root.innerHTML='<div class="card"><div class="steps" id="step">Connecting…</div><div id="app">Please wait.</div></div>';let r=await fetch(API+'?action=join',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({scene_code:scene})});let d=await r.json();if(!r.ok){app.innerHTML='<h2>Demo scene unavailable</h2>';return}sess=d.session;render()}
function esc(v){return String(v||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function goBack(to){n=to;render()}
function nav(backTo,nextLabel='Continue',nextId='next'){return `<div class="nav">${backTo?`<button class="btn alt" id="back">← Back</button>`:'<span></span>'}<button class="btn" id="${nextId}">${nextLabel}</button></div>`}
function render(){step.textContent=`Step ${n} of 5 • Private session ${String(sess.session_no).padStart(3,'0')}`;
if(n===1){app.innerHTML='<h2>Choose your language</h2><div class="lang">'+['English','Français','العربية','中文','ਪੰਜਾਬੀ','Español','Українська'].map(x=>`<button class="${x===lang?'on':''}" data-lang="${x}">${x}</button>`).join('')+'</div>'+nav(0);document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render()});next.onclick=()=>{n=2;render()}}
if(n===2){app.innerHTML=`<h2>Witness details</h2><p class="muted">Use fictional information only.</p><div class="field"><label>Name</label><input id="name" value="${esc(name||'Alex Example')}"></div><div class="field"><label>Contact</label><input id="contact" value="${esc(contact||'demo@example.test')}"></div>${nav(1)}`;document.getElementById('back').onclick=()=>goBack(1);next.onclick=()=>{name=document.getElementById('name').value;contact=document.getElementById('contact').value;n=3;render()}}
if(n===3){app.innerHTML=`<h2>Tell us what you saw or heard</h2><p class="muted">Speak in your own words. Do not include real information in this demonstration.</p><div class="recordbox"><b>Audio statement</b><div class="timer" id="timer">${fmt(recSeconds)}</div><div class="nav"><button class="btn ${recState==='recording'?'rec':''}" id="record">${recState==='recording'?'■ Stop Recording':'● Start Recording'}</button>${audioURL?'<button class="btn alt" id="redo">Record Again</button>':''}</div>${audioURL?`<audio class="audio" controls src="${audioURL}"></audio>`:''}<p id="micmsg" class="muted">Your browser will ask for microphone permission when you start.</p></div><div class="notice" style="margin-top:12px"><b>Demo transcription:</b> when you continue, this fictional test recording is sent securely for automatic speech-to-text. Do not record real witness information.</div>${nav(2,'Continue to Review')}`;document.getElementById('back').onclick=()=>goBack(2);record.onclick=toggleRecording;if(audioURL)redo.onclick=resetRecording;next.onclick=async()=>{if(recState==='recording'){alert('Stop the recording before continuing.');return}if(!audioBlob){alert('Please record a demo statement before continuing.');return}next.disabled=true;next.textContent='Transcribing…';try{const fd=new FormData();const mime=audioBlob.type||'';let ext=mime.includes('mp4')?'m4a':mime.includes('ogg')?'ogg':mime.includes('wav')?'wav':mime.includes('mpeg')?'mp3':'webm';fd.append('audio',audioBlob,'statement.'+ext);const r=await fetch(API+'?action=transcribe',{method:'POST',body:fd});const d=await r.json();if(!r.ok)throw new Error(d.detail||d.error||'Transcription failed');tr=d.text||'';rev=tr;n=4;render()}catch(e){next.disabled=false;next.textContent='Continue to Review';alert('Transcription could not be completed: '+e.message)}}}
if(n===4){app.innerHTML=`<h2>Review & evidence</h2>${audioURL?`<div class="field"><label>Replay your statement</label><audio class="audio" controls src="${audioURL}"></audio></div>`:''}<div class="field"><label>Transcript review</label><textarea id="rev" rows="7" placeholder="Automatic transcript will appear here when transcription is connected.">${esc(rev||tr)}</textarea></div><div class="notice">In the production version, the original audio, original machine transcript and any witness corrections will be preserved separately.</div><div class="field"><label>Add demo evidence</label><input id="f" type="file" accept="image/*,video/*,audio/*,.pdf" multiple></div><p id="fc" class="muted">${files} uploaded</p><div id="elist">${evidenceItems.length?evidenceItems.map(x=>'<div class="notice" style="margin:8px 0">✓ '+esc(x.original_name)+' — '+Math.max(1,Math.round((x.size_bytes||0)/1024))+' KB</div>').join(''):''}</div><div id="uploadmsg" class="notice">For this demonstration, choose only fictional/test files. Selected files will be securely uploaded to private demo storage and integrity-hashed.</div>${nav(3)}`;(async()=>{try{const r=await fetch(API+'?action=evidence-list&session_token='+encodeURIComponent(sess.session_token));const d=await r.json();if(r.ok){evidenceItems=d.items||[];files=evidenceItems.length;document.getElementById('fc').textContent=files+' uploaded';document.getElementById('elist').innerHTML=evidenceItems.map(x=>'<div class="notice" style="margin:8px 0">✓ '+esc(x.original_name)+' — '+Math.max(1,Math.round((x.size_bytes||0)/1024))+' KB</div>').join('')}}catch{}})();document.getElementById('back').onclick=()=>{rev=document.getElementById('rev').value;goBack(3)};document.getElementById('f').onchange=async(e)=>{const input=e.currentTarget;const chosen=Array.from(input.files||[]);if(!chosen.length)return;input.disabled=true;document.getElementById('uploadmsg').textContent='Uploading demo evidence…';let done=0;try{for(const file of chosen){const fd=new FormData();fd.append('session_token',sess.session_token);fd.append('file',file,file.name);const r=await fetch(API+'?action=upload-evidence',{method:'POST',body:fd});const d=await r.json();if(!r.ok)throw new Error(d.error||'Upload failed');done++}const lr=await fetch(API+'?action=evidence-list&session_token='+encodeURIComponent(sess.session_token));const ld=await lr.json();evidenceItems=lr.ok?(ld.items||[]):evidenceItems;files=evidenceItems.length;document.getElementById('fc').textContent=files+' uploaded';document.getElementById('elist').innerHTML=evidenceItems.map(x=>'<div class="notice" style="margin:8px 0">✓ '+esc(x.original_name)+' — '+Math.max(1,Math.round((x.size_bytes||0)/1024))+' KB</div>').join('');document.getElementById('uploadmsg').textContent='✓ '+done+' demo file(s) securely uploaded and integrity-hashed.'}catch(e){document.getElementById('uploadmsg').textContent='Upload could not be completed: '+e.message}finally{input.value='';input.disabled=false}};document.getElementById('next').onclick=()=>{rev=document.getElementById('rev').value;n=5;render()}}
if(n===5){app.innerHTML=`<h2>Sign & submit</h2><p class="muted">Use a fake demo signature only.</p><div class="field"><label>Draw your demo signature with your finger</label><div class="sigbox"><canvas id="sig"></canvas></div><div class="sigactions"><button class="btn alt" id="clearSig">Clear signature</button></div></div><div class="notice">This demonstration lets you test finger signing. The signature is not uploaded or stored.</div>${nav(4,'Demo Submit','submit')}`;document.getElementById('back').onclick=()=>goBack(4);setupSignature();submit.onclick=()=>{if(!signatureData){alert('Please add a demo signature before submitting.');return}submitDemo()}}}
function setupSignature(){const canvas=document.getElementById('sig');const ctx=canvas.getContext('2d');let drawing=false,moved=false;function size(){const dpr=window.devicePixelRatio||1;const rect=canvas.getBoundingClientRect();canvas.width=Math.max(1,Math.floor(rect.width*dpr));canvas.height=Math.max(1,Math.floor(180*dpr));ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#10233d';if(signatureData){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,rect.width,180);im.src=signatureData}}function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}canvas.addEventListener('pointerdown',e=>{drawing=true;moved=false;canvas.setPointerCapture(e.pointerId);const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y)});canvas.addEventListener('pointermove',e=>{if(!drawing)return;const p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke();moved=true});function end(){if(!drawing)return;drawing=false;if(moved)signatureData=canvas.toDataURL('image/png')}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);document.getElementById('clearSig').onclick=()=>{signatureData='';ctx.clearRect(0,0,canvas.width,canvas.height)};size()}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
async function toggleRecording(){if(recState==='recording'){mediaRecorder.stop();return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});audioChunks=[];mediaRecorder=new MediaRecorder(stream);mediaRecorder.ondataavailable=e=>{if(e.data.size)audioChunks.push(e.data)};mediaRecorder.onstop=()=>{clearInterval(recTimer);audioBlob=new Blob(audioChunks,{type:mediaRecorder.mimeType||audioChunks[0]?.type||'audio/mp4'});if(audioURL)URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(audioBlob);stream.getTracks().forEach(t=>t.stop());recState='stopped';render()};mediaRecorder.start();recSeconds=0;recState='recording';recTimer=setInterval(()=>{recSeconds++;let t=document.getElementById('timer');if(t)t.textContent=fmt(recSeconds)},1000);render()}catch(e){let m=document.getElementById('micmsg');if(m)m.textContent='Microphone access was not granted. Check browser microphone permission and try again.'}}
function resetRecording(){if(audioURL)URL.revokeObjectURL(audioURL);audioURL='';audioBlob=null;audioChunks=[];recSeconds=0;recState='idle';render()}
